name: Build

# Reusable build + test + package pipeline shared by ci.yml (PRs),
# nightly.yml (main) and release.yml (tags). Every caller builds the same
# packages, so a packaging break shows up on the PR, not after the tag.
#
# Packages are produced from `cmake --install`, which lays out the app,
# parts library and translations exactly where the app looks for them
# (see "Install layout" in the top-level CMakeLists.txt), then bundles
# the runtime: windeployqt + MSVC runtime on Windows, macdeployqt on
# macOS, linuxdeploy on Linux.

on:
  workflow_call:
    inputs:
      version:
        description: Version to stamp (X.Y.Z). Empty keeps the CMake default.
        type: string
        default: ''
      artifact-suffix:
        description: Inserted after the product name in artifact file names.
        type: string
        default: ''
      sign:
        description: Code-sign / notarize when the signing secrets exist.
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  QT_VERSION: '6.12.*'
  # Headless test runs; never pop a message box from QCommandLineParser.
  QT_QPA_PLATFORM: offscreen
  QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: the AppImage only runs on distros with a
          # glibc at least as new as the build host's.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x86_64
          # One universal (arm64 + x86_64) bundle; Qt's macOS binaries are
          # universal already.
          - os: macos-15
            name: macos-universal
            # The macOS minimum (CMAKE_OSX_DEPLOYMENT_TARGET) is set in
            # CMakeLists.txt, from Qt's own.
            cmake_extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT: collaborative-brick-layout-designer${{ inputs.artifact-suffix }}-${{ matrix.name }}
      # A step's `if:` can't read that step's own `env:`, so the "are the
      # signing secrets configured?" checks are resolved here, at job level.
      HAS_MACOS_CERT:  ${{ inputs.sign && secrets.MACOS_CERTIFICATE != '' }}
      HAS_APPLE_ID:    ${{ inputs.sign && secrets.APPLE_ID != '' }}
      HAS_WINDOWS_PFX: ${{ inputs.sign && secrets.WINDOWS_PFX_BASE64 != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          # aqtinstall 3.3.0 (the latest release) cannot find Qt >= 6.11 for Windows.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version: ${{ env.QT_VERSION }}
          # The server features (src/sync) talk to the server over WebSockets;
          # qtimageformats reads the WebP pictures it sends (club logos), and the
          # deploy tools bundle its plugins with the app.
          modules: qtwebsockets qtimageformats
          cache: true

      # The server features read shared layouts with yrs, a Rust library
      # built by cargo. macOS builds it for both architectures and Corrosion
      # lipo's them into one universal static library; Windows uses the
      # default x86_64-pc-windows-msvc target, matching MSVC.
      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Compiler cache, saved per platform. PR runs restore main's cache,
      # so only what changed recompiles. ccache understands macOS's
      # two-arch compiles; sccache is the one that caches MSVC.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ${{ matrix.name }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 1G

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libcups2-dev libsecret-1-dev xvfb weston

      - name: Configure
        shell: bash
        run: |
          VERSION_ARG=()
          if [ -n "${{ inputs.version }}" ]; then VERSION_ARG=(-DBLD_VERSION="${{ inputs.version }}"); fi
          LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          # Warnings are errors in CI (off by default for local builds).
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBLD_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=$LAUNCHER -DCMAKE_CXX_COMPILER_LAUNCHER=$LAUNCHER \
            "${VERSION_ARG[@]}" ${{ matrix.cmake_extra }} 2>&1 | tee configure.log
          # Resolved version (input or CMake default) for package names / MSI.
          echo "BLD_VERSION=$(cmake -N -L build | sed -n 's/^BLD_VERSION:STRING=//p')" >> "$GITHUB_ENV"

      # PowerShell, not bash: in Git Bash `link` is coreutils' link, which
      # cargo would run instead of MSVC's link.exe.
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # The build is warning-free: a new compiler, linker or CMake warning fails it.
      - name: No warnings
        shell: bash
        run: scripts/ci/check-warnings.sh configure.log build.log

      # The help texts must match the web's word for word: fetch the web's
      # catalogue at the commit src/ui/help/web-help-texts.commit names (the
      # PR that copies the web's words bumps it), so
      # HelpTexts.MatchesTheWebCatalogueWordForWord runs here instead of
      # skipping. Pinned, not main: a change on the web's main no longer
      # turns this build red, and a tag builds the same way forever. A
      # failed fetch fails that test.
      - name: Fetch the web's help texts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sha=$(tr -d '[:space:]' < src/ui/help/web-help-texts.commit)
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/help-texts.json" \
            "https://raw.githubusercontent.com/collaborative-brick-layout-designer/web/$sha/apps/web/src/help/help-texts.json" || true
          echo "BLD_WEB_HELP_TEXTS=$RUNNER_TEMP/help-texts.json" >> "$GITHUB_ENV"

      # The render goldens (tests/rendering/RenderGoldensTest.cpp) run on
      # Linux only, where they were captured, with the packs the corpus maps
      # use beyond the bundled library, checksum-checked.
      - name: Parts packs for the render goldens (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/golden-packs" && cd "$RUNNER_TEMP/golden-packs"
          curl -fsSL --retry 3 -o TrixBrix.zip https://bluebrick.lswproject.com/download/package/TrixBrix.1.8.5.zip
          curl -fsSL --retry 3 -o BrickTracks.zip https://bluebrick.lswproject.com/download/package/BrickTracks.1.1.zip
          sha256sum -c - <<'SUMS'
          79c4bf6dbb28b03f6cd7e5b783db2743423700795e839ef3ee3df5ed71aebd8f  TrixBrix.zip
          e25ab99a02fcd6ae02828fc00e7bc8b00cedcb52778f25940da36fbfc269aac4  BrickTracks.zip
          SUMS
          unzip -q TrixBrix.zip && unzip -q BrickTracks.zip
          echo "BLD_RENDER_GOLDENS_PARTS=$PWD/TrixBrix:$PWD/BrickTracks" >> "$GITHUB_ENV"
          echo "BLD_ENABLE_RENDER_GOLDENS=1" >> "$GITHUB_ENV"

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 300

      - name: Upload the render goldens' renders
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-goldens-actual
          path: fixtures/render-goldens/actual/
          if-no-files-found: ignore
          retention-days: 14

      # ---------------------------------------------------------------- Linux
      - name: Package (Linux AppImage + tar.gz)
        if: runner.os == 'Linux'
        run: |
          APPDIR="$PWD/AppDir"
          cmake --install build --prefix "$APPDIR/usr"
          # linuxdeploy-plugin-qt links our .qm files into usr/translations
          # and fails if it doesn't exist yet.
          mkdir -p "$APPDIR/usr/translations"

          # Tagged releases, checked against their SHA-256, not the moving
          # "continuous" builds: the same tools build every AppImage, and a
          # replaced download can't run in this job.
          curl -sSfL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -sSfL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          sha256sum -c - <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt
          SUMS
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          # Runners have no FUSE; run the tool AppImages extracted.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Native Wayland on top of xcb. File names vary by Qt version
          # (libqwayland-egl/-generic up to 6.x, one libqwayland.so later).
          WAYLAND_PLUGINS=$(cd "$QT_ROOT_DIR/plugins/platforms" && ls libqwayland*.so 2>/dev/null | paste -sd';')
          if [ -z "$WAYLAND_PLUGINS" ]; then
            echo "::error::No Wayland platform plugin in $QT_ROOT_DIR/plugins/platforms"
            ls "$QT_ROOT_DIR/plugins/platforms"
            exit 1
          fi
          export EXTRA_PLATFORM_PLUGINS="$WAYLAND_PLUGINS"
          export EXTRA_QT_MODULES="waylandcompositor"
          export OUTPUT="$ARTIFACT.AppImage"
          export LINUXDEPLOY_OUTPUT_VERSION="$BLD_VERSION"
          ./linuxdeploy --appdir "$APPDIR" --plugin qt --output appimage

          # The tarball is the same bundled AppDir (Qt libs + plugins
          # included), with a top-level launcher.
          mkdir -p dist
          cp -a "$APPDIR" dist/brick-layout-designer
          ln -s usr/bin/brick-layout-designer dist/brick-layout-designer/brick-layout-designer
          tar -czf "$ARTIFACT.tar.gz" -C dist brick-layout-designer

      - name: Smoke test packages (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # xcb is the only platform plugin bundled, so this also proves the
          # bundle is self-contained.
          xvfb-run -a "./$ARTIFACT.AppImage" --version | grep -F "$BLD_VERSION"
          xvfb-run -a ./dist/brick-layout-designer/brick-layout-designer --version | grep -F "$BLD_VERSION"
          # The server features are in: the app links Qt WebSockets (only
          # src/sync uses it) and the package bundles it.
          test -f dist/brick-layout-designer/usr/lib/libQt6WebSockets.so.6
          readelf -d dist/brick-layout-designer/usr/bin/brick-layout-designer | grep -q 'libQt6WebSockets'
          test -d dist/brick-layout-designer/usr/share/brick-layout-designer/parts/BlueBrickParts/parts
          # No scripts from the upstream parts library in the package.
          if find dist -iname '*.bat' -o -iname '*.cmd' | grep .; then exit 1; fi
          test -f dist/brick-layout-designer/usr/share/brick-layout-designer/help/en/index.html
          # Nothing for building against (QtKeychain's headers and .a used to come along).
          scripts/ci/check-package-files.sh dist/brick-layout-designer
          # Every UI language finds its own catalog and Qt's, in the package.
          xvfb-run -a ./dist/brick-layout-designer/brick-layout-designer --check-translations
          # And natively under a headless Wayland compositor.
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless-backend.so --socket=bld-test &
          WESTON=$!
          for _ in $(seq 20); do [ -S "$XDG_RUNTIME_DIR/bld-test" ] && break; sleep 0.5; done
          WAYLAND_DISPLAY=bld-test QT_QPA_PLATFORM=wayland "./$ARTIFACT.AppImage" --version | grep -F "$BLD_VERSION"
          kill "$WESTON"

      # ---------------------------------------------------------------- macOS
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          # Qt's deploy step requires an absolute install prefix.
          cmake --install build --config Release --prefix "$PWD/dist"
          APP=dist/brick-layout-designer.app
          # Parts/translations land in Resources after macdeployqt ran, which
          # invalidates its ad-hoc signature; re-seal. Replaced by the real
          # identity below when signing secrets are configured.
          codesign --force --deep --sign - "$APP"
          lipo -archs "$APP/Contents/MacOS/brick-layout-designer"
          lipo "$APP/Contents/MacOS/brick-layout-designer" -verify_arch arm64 x86_64
          # The server features are in: the app links Qt WebSockets (only
          # src/sync uses it) and the bundle has it.
          test -d "$APP/Contents/Frameworks/QtWebSockets.framework"
          otool -L "$APP/Contents/MacOS/brick-layout-designer" | grep -q QtWebSockets
          # Info.plist's LSMinimumSystemVersion covers what Qt's frameworks need.
          scripts/ci/check-macos-minimum.sh "$APP"
          scripts/ci/check-package-files.sh "$APP"
          # Every UI language finds its own catalog and Qt's, in the bundle.
          "$APP/Contents/MacOS/brick-layout-designer" --check-translations

      - name: Codesign (macOS)
        # No-op unless the Apple Developer secrets are configured; see
        # docs/SIGNING.md. Unsigned builds open via right-click -> Open.
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE:      ${{ secrets.MACOS_CERTIFICATE }}       # base64-encoded .p12
          MACOS_CERTIFICATE_PWD:  ${{ secrets.MACOS_CERTIFICATE_PWD }}   # passphrase for the .p12
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}  # "Developer ID Application: Name (TEAMID)"
          MACOS_KEYCHAIN_PWD:     ${{ secrets.MACOS_KEYCHAIN_PWD }}      # any short random string
        run: |
          # Per-job keychain so nothing leaks across runs.
          KEYCHAIN=build.keychain
          security create-keychain -p "${MACOS_KEYCHAIN_PWD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PWD}" "${KEYCHAIN}"
          echo "${MACOS_CERTIFICATE}" | base64 --decode > cert.p12
          security import cert.p12 -k "${KEYCHAIN}" -P "${MACOS_CERTIFICATE_PWD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${MACOS_KEYCHAIN_PWD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain
          # Hardened runtime so notarization accepts it.
          codesign --force --deep --options runtime --timestamp \
            --sign "${MACOS_CERTIFICATE_NAME}" dist/brick-layout-designer.app
          rm -f cert.p12

      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_ID == 'true'
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}            # Apple Developer account email
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}  # app-specific password
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}       # 10-char team ID
        run: |
          ditto -c -k --keepParent dist/brick-layout-designer.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "${APPLE_ID}" --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" --wait
          xcrun stapler staple dist/brick-layout-designer.app
          rm -f notarize.zip

      - name: Package (macOS .zip + .dmg)
        if: runner.os == 'macOS'
        run: |
          APP=dist/brick-layout-designer.app
          "$APP/Contents/MacOS/brick-layout-designer" --version | grep -F "$BLD_VERSION"
          test -d "$APP/Contents/Resources/parts/BlueBrickParts/parts"
          test -f "$APP/Contents/Resources/help/en/index.html"
          # ditto keeps the extended attributes / signature intact.
          ditto -c -k --keepParent "$APP" "$ARTIFACT.zip"
          # Drag-to-Applications disk image.
          mkdir -p dmg
          cp -R "$APP" "dmg/Collaborative Brick Layout Designer.app"
          ln -s /Applications dmg/Applications
          # hdiutil intermittently fails with "Resource busy" on hosted runners.
          for attempt in 1 2 3; do
            hdiutil create -volname "Collaborative Brick Layout Designer" -srcfolder dmg -ov -format UDZO "$ARTIFACT.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done

      # -------------------------------------------------------------- Windows
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Qt's deploy step requires an absolute install prefix.
          cmake --install build --config Release --prefix "$PWD/dist/brick-layout-designer"
          # Without Qt on PATH, so it runs only if the DLLs it needs are beside it.
          PATH="/c/Windows/System32:/c/Windows" ./dist/brick-layout-designer/brick-layout-designer.exe --version > version.txt
          cat version.txt
          grep -F "$BLD_VERSION" version.txt
          test -f dist/brick-layout-designer/vcruntime140.dll
          # The server features are in: the app links Qt WebSockets (only
          # src/sync uses it; dumpbin lists the DLLs it imports) and the zip has it.
          ls dist/brick-layout-designer | grep -i -E 'websockets|vcruntime' || true
          test -f dist/brick-layout-designer/Qt6WebSockets.dll || { echo "::error::Qt6WebSockets.dll not bundled"; exit 1; }
          dumpbin //dependents dist/brick-layout-designer/brick-layout-designer.exe > deps.txt
          cat deps.txt
          grep -qi 'Qt6WebSockets.dll' deps.txt || { echo "::error::the app doesn't link Qt WebSockets"; exit 1; }
          test -d dist/brick-layout-designer/parts/BlueBrickParts/parts
          test -f dist/brick-layout-designer/help/en/index.html
          # Nothing for building against, and no vc_redist.x64.exe: the MSVC
          # runtime DLLs are beside the app.
          scripts/ci/check-package-files.sh dist/brick-layout-designer
          # Every UI language finds its own catalog and Qt's, in the package.
          PATH="/c/Windows/System32:/c/Windows" ./dist/brick-layout-designer/brick-layout-designer.exe --check-translations > translations.txt || { cat translations.txt; exit 1; }
          cat translations.txt

      - name: Codesign exe (Windows)
        # Signs the binaries before they are zipped / wrapped in the MSI.
        # No-op unless WINDOWS_PFX_BASE64 is configured (see docs/SIGNING.md).
        if: runner.os == 'Windows' && env.HAS_WINDOWS_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}  # base64-encoded .pfx
          WINDOWS_PFX_PWD:    ${{ secrets.WINDOWS_PFX_PWD }}     # passphrase for the .pfx
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $SDKSign = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $SDKSign) { $SDKSign = "signtool.exe" }
          Get-ChildItem -Path dist -Recurse -Include *.exe,*.dll | ForEach-Object {
            & $SDKSign sign /f cert.pfx /p $env:WINDOWS_PFX_PWD `
              /fd SHA256 /tr http://timestamp.sectigo.com /td SHA256 $_.FullName
          }
          Remove-Item cert.pfx

      - name: Package (Windows .zip + MSI)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          (cd dist && 7z a "../$ARTIFACT.zip" brick-layout-designer)

          # An exact WiX, and its UI extension at the same version (a newer
          # extension doesn't load in WiX 4). A failed install fails the job.
          WIX_VERSION=4.0.6
          dotnet tool install --global wix --version "$WIX_VERSION"
          export PATH="$HOME/.dotnet/tools:$PATH"
          rm -rf packaging/windows/staging
          cp -r dist/brick-layout-designer packaging/windows/staging
          cd packaging/windows
          wix extension add "WixToolset.UI.wixext/$WIX_VERSION"
          # The license page shows LICENSE (GPL-3.0), as RTF.
          python ../../scripts/text-to-rtf.py ../../LICENSE License.rtf
          # Mirror staging/ (Qt plugins in their subdirs, parts library,
          # translations) into Harvested.wxs.
          python ../../scripts/harvest-wix.py \
            --staging staging \
            --out Harvested.wxs \
            --exclude-top brick-layout-designer.exe
          wix build brick-layout-designer.wxs Harvested.wxs \
            -ext WixToolset.UI.wixext \
            -d Version="$BLD_VERSION" \
            -arch x64 \
            -out "../../$ARTIFACT.msi"

      # The MSI asks where to install and shows the license, and Apps &
      # Features has the icon and links (read from its tables).
      - name: Check the MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @((Resolve-Path "$env:ARTIFACT.msi").Path, 0))
          function Rows($sql) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
            $rows = @()
            while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
              $rows += $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1)
            }
            $rows
          }
          $dialogs = Rows 'SELECT Dialog FROM Dialog'
          $props = Rows 'SELECT Property FROM Property'
          $missing = @()
          foreach ($d in 'WelcomeDlg', 'LicenseAgreementDlg', 'InstallDirDlg', 'VerifyReadyDlg') { if ($dialogs -notcontains $d) { $missing += "dialog $d" } }
          foreach ($p in 'ARPPRODUCTICON', 'ARPURLINFOABOUT', 'ARPHELPLINK', 'WIXUI_INSTALLDIR') { if ($props -notcontains $p) { $missing += "property $p" } }
          if ($missing.Count -gt 0) { Write-Error "The MSI is missing: $($missing -join ', ')"; exit 1 }
          Write-Host "Dialogs: $($dialogs -join ', ')"

      - name: Codesign MSI (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PWD:    ${{ secrets.WINDOWS_PFX_PWD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $SDKSign = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $SDKSign) { $SDKSign = "signtool.exe" }
          & $SDKSign sign /f cert.pfx /p $env:WINDOWS_PFX_PWD `
            /fd SHA256 /tr http://timestamp.sectigo.com /td SHA256 "$env:ARTIFACT.msi"
          Remove-Item cert.pfx

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.*
            !${{ env.ARTIFACT }}.wixpdb
          if-no-files-found: error
